name: Bug report
description: Report a reproducible Reweft defect without secrets or customer data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes: {value: "For vulnerabilities, stop and use private vulnerability reporting per SECURITY.md."}
  - type: textarea
    id: behavior
    attributes: {label: Observed behavior, description: Include sanitized errors and what you expected.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Use synthetic data and include the exact revision and commands.}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment, description: OS, deployment profile, browser, connector and versions as relevant.}
    validations: {required: true}

