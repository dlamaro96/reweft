name: Feature or RFC proposal
description: Propose a scoped product, contract, or architecture change.
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: need
    attributes: {label: User need and evidence}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed outcome and alternatives}
    validations: {required: true}
  - type: textarea
    id: boundaries
    attributes: {label: Safety, privacy, compatibility, and migration impact}
    validations: {required: true}

