name: Release candidate evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images without publishing
        env:
          REWEFT_SECRET_KEY: release-check-only
          POSTGRES_PASSWORD: release-check-only
          TEMPORAL_DB_PASSWORD: release-check-only
          DATABASE_URL: postgresql://reweft:release-check-only@postgres:5432/reweft
        run: docker compose --env-file .env.example build
      - name: Explain publication boundary
        run: echo "This workflow builds only. Publication, signing, attestations, and release creation require an explicitly authorized workflow and are not claimed here."

