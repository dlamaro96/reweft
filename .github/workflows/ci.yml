name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.14
      - name: Validate contracts
        run: make contracts
      - name: Backend tests
        run: uv run --project backend --extra dev pytest
      - name: Compile backend
        run: uv run --project backend python -m compileall -q backend/src backend/tests
      - name: Repository policy check
        run: ./scripts/release-check.sh

  frontend:
    runs-on: ubuntu-latest
    container: node:22.22.2-bookworm-slim
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Compose model
        env:
          REWEFT_SECRET_KEY: compose-check-only
          POSTGRES_PASSWORD: compose-check-only
          TEMPORAL_DB_PASSWORD: compose-check-only
          DATABASE_URL: postgresql://reweft:compose-check-only@postgres:5432/reweft
        run: docker compose --env-file .env.example config --quiet
