[project]
name = "reweft-backend"
version = "0.1.0"
description = "Source-safe assessment API for Reweft"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.19.2",
  "cryptography>=45,<47",
  "duckdb>=1.4,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.3.5,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy==2.0.52",
  "temporalio==1.32.0",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reweft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
