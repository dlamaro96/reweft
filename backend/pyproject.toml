[project]
name = "reweft-backend"
version = "0.1.0"
description = "Source-safe assessment API for Reweft"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reweft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

